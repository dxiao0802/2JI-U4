<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a1a">
<title>N3 衝刺島</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1d1d2b;--mut:#6b6b80;--line:#e3e2ee;--pri:#ff7a1a;--pri2:#d95f00;--ok:#20a957;--ok2:#178343;--okbg:#e2f7ea;--bad:#e5484d;--bad2:#b8323a;--badbg:#fde7e8;--gold:#f5b400;--blue:#3b82f6;--blue2:#2563c9;--pur:#8b5cf6;--shadow:0 2px 0 var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121319;--card:#1c1d27;--ink:#ececf4;--mut:#9b9bb2;--line:#2d2e3c;--okbg:#10301d;--badbg:#3a1619}}
:root[data-theme="dark"]{--bg:#121319;--card:#1c1d27;--ink:#ececf4;--mut:#9b9bb2;--line:#2d2e3c;--okbg:#10301d;--badbg:#3a1619}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Noto Sans JP","Hiragino Sans","Microsoft JhengHei",sans-serif}
body{min-height:100vh;overflow-x:hidden}
.wrap{max-width:540px;margin:0 auto;padding:0 16px 96px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 0 10px;border-bottom:2px solid var(--line)}
.brand{font-weight:800;font-size:18px;display:flex;gap:6px;align-items:center}
.pills{display:flex;gap:12px;font-weight:800}
.pill{display:flex;gap:4px;align-items:center}
.pill.fire{color:var(--pri)}.pill.gem{color:var(--blue)}.pill.heart{color:var(--bad)}
.pill.off{filter:grayscale(1);opacity:.55}
/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.goal{display:flex;gap:14px;align-items:center}
.ring{width:64px;height:64px;flex:none}
.goal h3{margin:0 0 4px;font-size:16px}.goal p{margin:0;color:var(--mut);font-size:14px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:block;width:100%;padding:14px 12px;border-radius:16px;font-weight:800;font-size:16px;text-align:center;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);transition:transform .06s}
.btn:active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.btn.pri{background:var(--pri);border-color:var(--pri2);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok2);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad2);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue2);color:#fff}
.btn small{display:block;font-weight:600;font-size:12px;opacity:.85;margin-top:2px}
.btn[disabled]{opacity:.45;pointer-events:none}
/* path */
.unit{margin-top:22px}
.uhead{border-radius:18px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:5px solid rgba(0,0,0,.18)}
.uhead b{font-size:17px}.uhead span{font-size:13px;opacity:.92}
.ubar{height:8px;background:rgba(255,255,255,.35);border-radius:9px;margin-top:8px;overflow:hidden;width:120px}
.ubar i{display:block;height:100%;background:#fff;border-radius:9px}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 4px}
.node{position:relative;width:76px;height:70px;border-radius:50%;font-size:30px;display:grid;place-items:center;border-bottom:7px solid rgba(0,0,0,.22);color:#fff;transition:transform .08s}
.node:active{transform:translateY(4px);border-bottom-width:3px}
.node.lock{background:var(--line)!important;color:var(--mut);border-bottom-color:rgba(0,0,0,.12)}
.node .stars{position:absolute;bottom:-22px;font-size:12px;white-space:nowrap;color:var(--gold);letter-spacing:1px}
.node .go{position:absolute;top:-34px;background:var(--card);border:2px solid var(--line);color:var(--pri);font-size:13px;font-weight:800;padding:3px 10px;border-radius:10px;animation:bob 1.2s ease-in-out infinite;white-space:nowrap}
@keyframes bob{50%{transform:translateY(-5px)}}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;max-width:180px;padding:10px 0 12px;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.55}
.nav button span{font-size:12px;font-weight:700}
.nav button.on{opacity:1;color:var(--pri)}
/* lesson */
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
.ov.show{display:flex}
.lt{max-width:620px;width:100%;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:12px}
.x{font-size:22px;color:var(--mut);padding:4px}
.pbar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden;position:relative}
.pbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:10px;transition:width .35s cubic-bezier(.3,1.4,.6,1),background .3s;position:relative}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.pbar.hot i{background:linear-gradient(90deg,var(--pri),var(--gold))}
.lh{font-weight:800;color:var(--bad);min-width:40px;text-align:right}
.combo{height:26px;max-width:620px;width:100%;margin:6px auto 0;padding:0 16px;font-weight:900;color:var(--pri);font-size:15px;opacity:0;transition:opacity .2s}
.combo.on{opacity:1}
.combo.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.25)}}
.lb{flex:1;overflow:auto;max-width:620px;width:100%;margin:0 auto;padding:6px 16px 20px}
.qlabel{font-weight:800;font-size:19px;margin:6px 0 16px;display:flex;align-items:center;gap:8px}
.new{background:var(--pur);color:#fff;font-size:11px;padding:2px 7px;border-radius:7px}
.prompt{text-align:center;margin:8px 0 24px}
.big{font-size:52px;font-weight:800;line-height:1.2}
.big.zh{font-size:30px}
.sent{font-size:22px;line-height:1.8;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--pri);text-align:center;color:var(--pri)}
.spk{width:96px;height:96px;border-radius:24px;background:var(--blue);border-bottom:6px solid var(--blue2);color:#fff;font-size:42px}
.spk:active{transform:translateY(3px);border-bottom-width:3px}
.opts{display:grid;gap:10px}
.opt{padding:14px 16px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-size:20px;font-weight:700;text-align:left;display:flex;gap:12px;align-items:center}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);font-size:13px;display:grid;place-items:center;color:var(--mut)}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.opt.dim{opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{padding:14px 8px;border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-weight:700;font-size:18px;min-height:60px}
.mt.sel{border-color:var(--blue);background:rgba(59,130,246,.12);color:var(--blue)}
.mt.done{opacity:0;pointer-events:none;transition:opacity .35s .15s}
.mt.okf{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.mt.badf{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
.timer{text-align:center;color:var(--mut);font-weight:700;margin-top:12px}
/* feedback */
.fb{transform:translateY(100%);transition:transform .22s ease-out;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.fb.show{transform:none}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fbi{max-width:620px;margin:0 auto}
.fb h4{margin:0 0 6px;font-size:21px;display:flex;align-items:center;gap:8px}
.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}
.fb p{margin:2px 0 12px;font-size:16px;line-height:1.6}
.fb .ex{font-size:15px;color:var(--mut)}
.mini{font-size:18px;padding:2px 6px;border-radius:8px}
.foot{padding:0 16px 16px;max-width:620px;width:100%;margin:0 auto}
/* result */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 16px;max-width:520px;width:100%;margin:0 auto}
.res h2{font-size:28px;margin:8px 0 4px;color:var(--gold)}
.mascot{font-size:84px;animation:jump .8s ease-in-out infinite alternate}
@keyframes jump{to{transform:translateY(-12px) rotate(-6deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:20px 0}
.st{border:2px solid;border-radius:16px;overflow:hidden}
.st b{display:block;color:#fff;font-size:12px;padding:4px 0}
.st div{padding:10px 0;font-size:22px;font-weight:900;background:var(--card)}
.chest{font-size:64px;cursor:pointer;animation:wig 1s infinite}
@keyframes wig{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(-10deg)}20%,40%{transform:rotate(10deg)}50%{transform:rotate(0)}}
.chest.open{animation:none}
.gain{font-weight:900;color:var(--blue);font-size:22px;height:30px}
/* toast & burst */
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-10px) scale(.9);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:800;z-index:50;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:86vw}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.burst{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:44px;font-weight:900;color:var(--pri);z-index:40;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.15);animation:burst .9s forwards;white-space:nowrap}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.xpfly{position:fixed;font-weight:900;color:var(--gold);z-index:41;pointer-events:none;animation:fly .8s forwards}
@keyframes fly{to{transform:translateY(-50px);opacity:0}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
/* modal */
.md{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:none;align-items:flex-end;justify-content:center}
.md.show{display:flex}
.mdb{background:var(--card);width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom));text-align:center}
.mdb h3{margin:6px 0 6px;font-size:22px}.mdb p{color:var(--mut);margin:0 0 16px}
.mdb .btn{margin-top:10px}
/* words & me */
.search{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;margin-top:14px}
.wl h4{margin:18px 0 6px;color:var(--mut);font-size:14px}
.wr{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.wr .dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.wr .dot.l{background:var(--gold)}.wr .dot.m{background:var(--ok)}.wr .dot.w{background:var(--bad)}
.wr .wk{font-size:19px;font-weight:700;min-width:5.5em}
.wr .wm{color:var(--mut);font-size:14px;flex:1}
.wr .wrr{font-size:13px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi b{display:block;font-size:24px}.kpi span{color:var(--mut);font-size:13px}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.a{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;color:var(--mut)}
.a i{display:block;font-style:normal;font-size:32px;margin-bottom:4px}
.a.lock i{filter:grayscale(1);opacity:.35}
.a.got{border-color:var(--gold);color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:6px}.seg button{padding:6px 12px;border-radius:10px;border:2px solid var(--line);font-weight:700}
.seg button.on{border-color:var(--pri);color:var(--pri)}
h2.sec{font-size:18px;margin:24px 0 8px}
.hint{color:var(--mut);font-size:13px;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="brand">🍙 N3 衝刺島</div>
    <div class="pills">
      <div class="pill fire" id="pFire">🔥 0</div>
      <div class="pill gem" id="pGem">💎 0</div>
      <div class="pill heart" id="pHeart">❤️ 5</div>
    </div>
  </div>
  <div id="vHome"></div>
  <div id="vWords" hidden></div>
  <div id="vMe" hidden></div>
</div>
<nav class="nav">
  <button class="on" data-v="Home">🗺️<span>闖關</span></button>
  <button data-v="Words">📒<span>單字本</span></button>
  <button data-v="Me">🏆<span>成就</span></button>
</nav>

<div class="ov" id="lesson">
  <div class="lt"><button class="x" id="lx" aria-label="離開">✕</button><div class="pbar" id="pbar"><i></i></div><div class="lh" id="lh">❤️5</div></div>
  <div class="combo" id="combo"></div>
  <div class="lb" id="lb"></div>
  <div class="foot" id="foot"></div>
  <div class="fb" id="fb"><div class="fbi" id="fbi"></div></div>
</div>
<div class="ov" id="result"></div>
<div class="md" id="md"><div class="mdb" id="mdb"></div></div>
<div class="toast" id="toast"></div>
<canvas id="cf"></canvas>

<script>
/* ============ 單字資料：漢字|讀音|中文|詞性|例句（[ ]＝目標字）|例句中文 ============ */
const UNITS=[
 {n:"日常動作",e:"🧹",c:"#ff7a1a"},{n:"心情個性",e:"💗",c:"#ec4899"},{n:"學校工作",e:"💼",c:"#3b82f6"},
 {n:"交通旅行",e:"🚃",c:"#14b8a6"},{n:"身體健康",e:"🩺",c:"#22a559"},{n:"家事購物",e:"🛒",c:"#f59e0b"},
 {n:"自然天氣",e:"⛅",c:"#0ea5e9"},{n:"抽象名詞",e:"🧠",c:"#8b5cf6"},{n:"必考副詞",e:"⚡",c:"#ef4444"},
 {n:"擬態語・外來語",e:"🎵",c:"#6366f1"}
];
const RAW=`片付ける|かたづける|收拾、整理|動|出かける前に部屋を[片付け]なさい。|出門前把房間收拾好。
預ける|あずける|寄放、託付|動|旅行の間、犬を友達に[預け]た。|旅行期間把狗寄放在朋友那裡。
預かる|あずかる|代為保管|動|お荷物はこちらで[預かり]ます。|行李由我們這邊保管。
断る|ことわる|拒絕|動|先輩の誘いを[断る]のは難しい。|很難拒絕前輩的邀約。
慌てる|あわてる|慌張|動|地震のときは[慌て]ないで行動してください。|地震時請不要慌張，冷靜行動。
諦める|あきらめる|放棄|動|最後まで[諦め]ないで頑張ろう。|堅持到最後，不要放棄。
間に合う|まにあう|來得及|動|走れば電車に[間に合う]かもしれない。|用跑的話也許趕得上電車。
迷う|まよう|迷路、猶豫|動|初めての町で道に[迷っ]た。|在第一次去的城市迷路了。
比べる|くらべる|比較|動|去年と[比べる]と、今年は雨が多い。|跟去年比，今年雨比較多。
届ける|とどける|送到、交給|動|拾った財布を交番に[届け]た。|把撿到的錢包送到派出所。
温める|あたためる|加熱、溫熱|動|このお弁当を[温め]ますか。|這個便當要加熱嗎？
冷える|ひえる|變冷、變涼|動|夜になると、だいぶ[冷え]てきた。|到了晚上變得相當冷。
謝る|あやまる|道歉|動|遅れたことを先生に[謝っ]た。|為遲到的事向老師道歉。
支払う|しはらう|支付|動|料金はカードで[支払う]ことができます。|費用可以用信用卡支付。
揃える|そろえる|備齊、使一致|動|必要な書類を[揃え]てから申し込んでください。|請備齊必要文件後再申請。
悔しい|くやしい|不甘心|形|試合に負けて、とても[悔しい]。|比賽輸了，非常不甘心。
恥ずかしい|はずかしい|丟臉、害羞|形|人前で転んで[恥ずかしかっ]た。|在大家面前跌倒，好丟臉。
懐かしい|なつかしい|懷念|形|この歌を聞くと、高校時代が[懐かしく]なる。|聽到這首歌就懷念起高中時代。
羨ましい|うらやましい|羨慕|形|毎年海外旅行に行ける彼が[羨ましい]。|很羨慕每年都能出國旅行的他。
大人しい|おとなしい|文靜、乖巧|形|弟は[大人しい]性格で、あまり話さない。|弟弟個性文靜，不太說話。
素直|すなお|坦率、聽話|形|彼は[素直]に自分の間違いを認めた。|他坦率地承認了自己的錯誤。
真面目|まじめ|認真|形|田中さんは[真面目]で、一度も遅刻したことがない。|田中很認真，從來沒遲到過。
正直|しょうじき|老實、誠實|形|[正直]に言うと、その映画はつまらなかった。|老實說，那部電影很無聊。
我慢|がまん|忍耐|名|痛くても少し[我慢]してください。|就算痛也請稍微忍耐一下。
退屈|たいくつ|無聊|形|雨の日は外に出られなくて[退屈]だ。|下雨天不能出門，好無聊。
面倒|めんどう|麻煩|形|毎日料理を作るのは[面倒]だ。|每天做飯很麻煩。
不安|ふあん|不安|形|初めての一人暮らしで[不安]なことが多い。|第一次一個人住，有很多不安的事。
夢中|むちゅう|著迷、熱衷|形|子どもたちはゲームに[夢中]になっている。|孩子們沉迷在遊戲裡。
意地悪|いじわる|壞心眼、捉弄|形|妹に[意地悪]をしてはいけません。|不可以捉弄妹妹。
緊張|きんちょう|緊張|名|面接の前はいつも[緊張]する。|面試前總是很緊張。
締め切り|しめきり|截止期限|名|レポートの[締め切り]は来週の金曜日だ。|報告的截止日是下週五。
提出|ていしゅつ|提交|名|宿題を明日までに[提出]してください。|請在明天之前交作業。
出席|しゅっせき|出席|名|会議に[出席]する人は手を挙げてください。|要出席會議的人請舉手。
欠席|けっせき|缺席|名|熱があるので、今日の授業は[欠席]します。|因為發燒，今天的課要缺席。

const dayDiff=(a,b)=>{const p=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};return Math.round((p(b)-p(a))/864e5);};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const HEART_MS=20*60e3;
function tickHearts(){
  if(S.hearts>=5){S.hearts=5;S.hAt=Date.now();return;}
  const n=Math.floor((Date.now()-S.hAt)/HEART_MS);
  if(n>0){S.hearts=Math.min(5,S.hearts+n);S.hAt+=n*HEART_MS;if(S.hearts>=5)S.hAt=Date.now();}
}
function tickDay(){
  const t=dk();
  if(S.day.d!==t)S.day={d:t,xp:0,n:0};
  if(S.last&&S.streak>0){
    const gap=dayDiff(S.last,t);
    if(gap>=2){
      const need=gap-1;
      if(S.freeze>=need){S.freeze-=need;const y=new Date();y.setDate(y.getDate()-1);S.last=dk(y);setTimeout(()=>toast("🧊 用了 "+need+" 個連勝凍結，連勝保住了！"),600);}

  }
}

function notes(fs,{type="sine",len=.11,gap=.075,vol=.16}={}){

}

function confetti(n=120){
  cf.width=innerWidth;cf.height=innerHeight;const cols=["#ff7a1a","#f5b400","#20a957","#3b82f6","#ec4899","#8b5cf6"];

/* ============ 讀音陷阱（長音、促音、濁音） ============ */
const DAK={"か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご","さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ","た":"だ","て":"で","と":"ど","は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ"};
const UND={};for(const[a,b]of Object.entries(DAK))UND[b]=a;
const OROW="こそとのほもよろごぞどぼぽょお";
const ROWS_TSU="かきくけこさしすせそたちつてとぱぴぷぺぽ";
function mutate(r){
  const a=[...r],ops=[];
  a.forEach((ch,i)=>{if(DAK[ch])ops.push(()=>{const b=a.slice();b[i]=DAK[ch];return b.join("");});if(UND[ch])ops.push(()=>{const b=a.slice();b[i]=UND[ch];return b.join("");});});
  a.forEach((ch,i)=>{
    if(OROW.includes(ch)&&a[i+1]==="う")ops.push(()=>{const b=a.slice();b.splice(i+1,1);return b.join("");});
    else if(OROW.includes(ch)&&i<a.length)ops.push(()=>{const b=a.slice();b.splice(i+1,0,"う");return b.join("");});
    if(ch==="ゅ"&&a[i+1]==="う")ops.push(()=>{const b=a.slice();b.splice(i+1,1);return b.join("");});
    else if(ch==="ゅ")ops.push(()=>{const b=a.slice();b.splice(i+1,0,"う");return b.join("");});
    if((ch==="せ"||ch==="け"||ch==="て"||ch==="れ")&&a[i+1]==="い")ops.push(()=>{const b=a.slice();b.splice(i+1,1);return b.join("");});
    if(ch==="ん")ops.push(()=>{const b=a.slice();b.splice(i,1);return b.join("");});
    else if(i===1&&a[0]!=="っ"&&a.length<=4)ops.push(()=>{const b=a.slice();b.splice(i,0,"ん");return b.join("");});
    if(ch==="っ")ops.push(()=>{const b=a.slice();b.splice(i,1);return b.join("");});
    else if(i>0&&ROWS_TSU.includes(ch)&&a[i-1]!=="っ"&&a[i-1]!=="ん")ops.push(()=>{const b=a.slice();b.splice(i,0,"っ");return b.join("");});
  });
  return ops;
}
function readingOpts(w){
  const out=new Set([w.r]),ops=mutate(w.r);
  for(const f of shuffle(ops)){if(out.size>=4)break;out.add(f());}
  let guard=0;
  while(out.size<4&&guard++<40){const o2=mutate(shuffle(ops).length?shuffle(ops)[0]():w.r);if(o2.length)out.add(shuffle(o2)[0]());}
  for(const x of shuffle(W)){if(out.size>=4)break;if(x.r!==w.r&&Math.abs(x.r.length-w.r.length)<=1&&x.k!==x.r)out.add(x.r);}
  out.delete(w.r);return [w.r,...[...out].slice(0,3)];
}

/* ============ 出題 ============ */
const pg=p=>p==="形"?"形":p==="動"?"動":p==="副"?"副":"名";
function distract(w,n,key,{cross=false}={}){
  const used=new Set([key(w)]),res=[];
  const tiers=[x=>pg(x.p)===pg(w.p)&&(!cross||x.u!==w.u),x=>pg(x.p)===pg(w.p),x=>true];
  for(const t of tiers){
    for(const x of shuffle(W)){if(res.length>=n)break;if(x.id===w.id||isNg(w,x)||x.r===w.r||!t(x))continue;const k=key(x);if(used.has(k))continue;used.add(k);res.push(x);}
    if(res.length>=n)break;
  }
  return res;
}
function mkItem(t,w){
  let opts,ans=0;
  if(t==="meaning"){opts=[w.m,...distract(w,3,x=>x.m).map(x=>x.m)];}
  else if(t==="reverse"||t==="listen"){opts=[w.k,...distract(w,3,x=>x.k).map(x=>x.k)];}
  else if(t==="reading"){opts=readingOpts(w);}
  else if(t==="cloze"){opts=[w.k,...distract(w,3,x=>x.k,{cross:true}).map(x=>x.k)];}
  const order=shuffle(opts.map((o,i)=>i));
  return{t,w,opts:order.map(i=>opts[i]),ans:order.indexOf(0)};
}
function typesFor(w,hard){
  const ts=hard?["reading","reading","cloze","cloze","cloze","listen","meaning","reverse"]:["meaning","meaning","reverse","reverse","listen","listen","cloze","cloze","reading"];
  return ts.filter(t=>(t!=="reading"||w.k!==w.r)&&(t!=="listen"||canListen())&&(t!=="cloze"||w.ex.includes("[")));
}
function buildItems(words,hard,n=10){
  const items=[];let pool=shuffle(words),i=0,last="";
  while(items.length<n){
    if(i>=pool.length){pool=shuffle(words);i=0;}
    const w=pool[i++];
    let ts=typesFor(w,hard);const seen=S.ws[w.id];
    if(!seen&&!hard)ts=ts.filter(t=>t==="meaning"||t==="listen"||t==="reverse");
    const pick=shuffle(ts.filter(t=>t!==last))[0]||ts[0];last=pick;
    items.push(mkItem(pick,w));
  }
  if(words.length>=5)items.splice(Math.min(5,items.length),0,{t:"match",ws:shuffle(words).slice(0,5)});
  return items;
}

/* ============ 成就 ============ */
const ACH=[
 {id:"first",i:"🐣",n:"第一步",d:"完成第一關",f:()=>S.lessons>=1},
 {id:"c5",i:"🔥",n:"手感發燙",d:"一關內 5 連擊",f:()=>S.maxCombo>=5},
 {id:"c10",i:"☄️",n:"停不下來",d:"一關內 10 連擊",f:()=>S.maxCombo>=10},
 {id:"c20",i:"🌋",n:"連擊之神",d:"一關內 20 連擊",f:()=>S.maxCombo>=20},
 {id:"perf",i:"💯",n:"零失誤",d:"完美通關一次",f:()=>S.perfect>=1},
 {id:"perf10",i:"👑",n:"完美主義",d:"完美通關 10 次",f:()=>S.perfect>=10},
 {id:"s3",i:"📅",n:"三天打魚",d:"連勝 3 天",f:()=>S.best>=3},
 {id:"s7",i:"🗓️",n:"一週不斷",d:"連勝 7 天",f:()=>S.best>=7},
 {id:"s30",i:"🏯",n:"修行者",d:"連勝 30 天",f:()=>S.best>=30},
 {id:"x100",i:"⭐",n:"百點",d:"累積 100 XP",f:()=>S.xp>=100},
 {id:"x1000",i:"🌟",n:"千點",d:"累積 1000 XP",f:()=>S.xp>=1000},
 {id:"m30",i:"📗",n:"30 字到手",d:"熟記 30 個字",f:()=>W.filter(w=>mastered(w.id)).length>=30},
 {id:"m100",i:"📚",n:"百字斬",d:"熟記 100 個字",f:()=>W.filter(w=>mastered(w.id)).length>=100},
 {id:"all",i:"🗾",n:"全島制霸",d:"所有關卡都過關",f:()=>UNITS.every((u,i)=>[1,2,3].every(l=>S.prog[i+"-"+l]))},
 {id:"n3",i:"🎌",n:"N3 合格！",d:"全部單字都熟記",f:()=>W.every(w=>mastered(w.id))}
];
function checkAch(){
  const got=ACH.filter(a=>!S.ach.includes(a.id)&&a.f());
  got.forEach((a,i)=>setTimeout(()=>{S.ach.push(a.id);S.gems+=15;save();renderTop();SFX.chest();confetti(80);toast(`<div style="font-size:40px">${a.i}</div>解鎖成就「${a.n}」<br><small>+15 💎</small>`,2400);},i*2600));
}

/* ============ 畫面 ============ */
function renderTop(){
  tickHearts();
  $("#pFire").innerHTML="🔥 "+S.streak;$("#pFire").classList.toggle("off",S.last!==dk());
  $("#pGem").innerHTML="💎 "+S.gems;$("#pHeart").innerHTML="❤️ "+S.hearts;
}
const weakCount=()=>W.filter(w=>weakScore(w.id)>0).length;
function ring(p){const r=26,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${p>=1?"var(--ok)":"var(--gold)"}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}" transform="rotate(-90 32 32)"/><text x="32" y="38" text-anchor="middle" font-size="18">${p>=1?"🎯":"⚡"}</text></svg>`;}
function renderHome(){
  const p=S.day.xp/S.goal,wc=weakCount(),studied=Object.keys(S.ws).length;
  let firstOpen=null;
  for(let u=0;u<UNITS.length&&!firstOpen;u++)for(let l=1;l<=3;l++)if(!S.prog[u+"-"+l]){firstOpen=u+"-"+l;break;}
  let h=`<div class="card goal">${ring(p)}<div><h3>今日目標 ${Math.min(S.day.xp,S.goal)} / ${S.goal} XP</h3><p>${p>=1?"目標達成！繼續刷可以衝更高 🔥":S.last===dk()?"再 "+(S.goal-S.day.xp)+" XP 就達標":"今天還沒練，連勝 🔥"+S.streak+" 天要斷了！"}</p></div></div>
  <div class="quick">
   <button class="btn pri" id="qWeak" ${wc<4?"disabled":""}>🎯 弱點特訓<small>${wc<4?"錯 4 個字後解鎖":wc+" 個弱點字・不扣愛心"}</small></button>
   <button class="btn blue" id="qRev" ${studied<6?"disabled":""}>⚡ 快速複習<small>${studied<6?"先玩幾關":"隨機 12 字・不扣愛心"}</small></button>
  </div>`;
  const icons=["📖","✏️","👑"],off=["-60px","40px","-20px"];
  UNITS.forEach((u,ui)=>{
    const uw=W.filter(w=>w.u===ui),m=uw.filter(w=>mastered(w.id)).length;
    h+=`<div class="unit"><div class="uhead" style="background:${u.c}"><div><span>第 ${ui+1} 區</span><br><b>${u.e} ${u.n}</b><div class="ubar"><i style="width:${m/uw.length*100}%"></i></div></div><span>熟記 ${m}/${uw.length}</span></div><div class="nodes">`;
    [1,2,3].forEach((l,li)=>{
      const k=ui+"-"+l,st=S.prog[k]||0,cur=k===firstOpen;
      h+=`<button class="node ${st||cur?"":"lock"}" style="background:${u.c};transform:translateX(${off[li]})" data-u="${ui}" data-l="${l}">${st?"⭐":icons[li]}${cur?'<span class="go">開始！</span>':""}${st?`<span class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</span>`:""}</button>`;
    });
    h+=`</div></div>`;
  });
  h+=`<div class="hint" style="text-align:center;margin-top:30px">第 1 關：前 8 字・第 2 關：後 8 字・第 3 關👑：全區混合（讀音＋填空加重）<br>灰色關卡也可以直接點，跳關挑戰 💪</div>`;
  $("#vHome").innerHTML=h;
  $("#vHome").querySelectorAll(".node").forEach(b=>b.onclick=()=>{SFX.tap();startLesson("unit",+b.dataset.u,+b.dataset.l);});
  const qw=$("#qWeak"),qr=$("#qRev");if(qw)qw.onclick=()=>startLesson("weak");if(qr)qr.onclick=()=>startLesson("review");
}
let wq="";
function renderWords(){
  const m=W.filter(w=>mastered(w.id)).length,l=Object.keys(S.ws).length;
  $("#vWords").innerHTML=`<input class="search" id="ws" placeholder="搜尋漢字、假名或中文…"><div class="hint">🟢 熟記 ${m}　🟡 學習中 ${l-m}　⚪ 還沒碰 ${W.length-l}　・點一下聽發音</div><div class="wl" id="wlist"></div>`;
  const inp=$("#ws");inp.value=wq;inp.oninput=()=>{wq=inp.value;renderWordList();};
  renderWordList();
}
function renderWordList(){
  let h="";
  const f=wq.trim();
  UNITS.forEach((u,ui)=>{
    const ws=W.filter(w=>w.u===ui&&(!f||w.k.includes(f)||w.r.includes(f)||w.m.includes(f)));
    if(!ws.length)return;
    h+=`<h4>${u.e} ${u.n}</h4>`+ws.map(w=>{const s=S.ws[w.id];const cls=!s?"":mastered(w.id)?"m":weakScore(w.id)>0?"w":"l";
      return `<div class="wr" data-id="${w.id}"><span class="dot ${cls}"></span><span class="wk jp">${w.k}</span><span class="wm">${w.k!==w.r?`<span class="jp">${w.r}</span>・`:""}${w.m}</span>${s?`<span class="wrr">${s.c}✓ ${s.w}✗</span>`:""}</div>`;}).join("");
  });
  $("#wlist").innerHTML=h||'<div class="hint">找不到這個字</div>';
  $("#wlist").querySelectorAll(".wr").forEach(r=>r.onclick=()=>{const w=W[+r.dataset.id];speak(w.r);toast(`<span class="jp">${w.ex.replace(/[\[\]]/g,"")}</span><br><small>${w.ez}</small>`,2600);});
}
function renderMe(){
  const m=W.filter(w=>mastered(w.id)).length;
  let h=`<h2 class="sec">📊 戰績</h2><div class="grid2">
   <div class="kpi"><b>⚡ ${S.xp}</b><span>總 XP</span></div><div class="kpi"><b>🔥 ${S.best}</b><span>最長連勝（天）</span></div>
   <div class="kpi"><b>📗 ${m}/${W.length}</b><span>熟記單字</span></div><div class="kpi"><b>☄️ ${S.maxCombo}</b><span>最高連擊</span></div></div>
  <h2 class="sec">🏆 成就 ${S.ach.length}/${ACH.length}</h2><div class="ach">${ACH.map(a=>`<div class="a ${S.ach.includes(a.id)?"got":"lock"}"><i>${a.i}</i><b>${a.n}</b><br>${a.d}</div>`).join("")}</div>
  <h2 class="sec">💎 商店</h2>
  <div class="card" style="margin-top:0"><div class="row" style="padding-top:0"><div>🧊 連勝凍結<div class="hint" style="margin:2px 0 0">漏一天自動用掉，連勝不中斷（擁有 ${S.freeze}）</div></div><button class="btn blue" style="width:auto;padding:8px 14px" id="bFreeze" ${S.gems<50||S.freeze>=2?"disabled":""}>50 💎</button></div>
  <div class="row" style="border:0;padding-bottom:0"><div>❤️ 補滿愛心</div><button class="btn blue" style="width:auto;padding:8px 14px" id="bHeart" ${S.gems<30||S.hearts>=5?"disabled":""}>30 💎</button></div></div>
  <h2 class="sec">⚙️ 設定</h2><div class="card" style="margin-top:0">
   <div class="row" style="padding-top:0"><span>每日目標</span><div class="seg" id="sGoal">${[20,30,50,80].map(g=>`<button class="${S.goal===g?"on":""}" data-g="${g}">${g}</button>`).join("")}</div></div>
   <div class="row"><span>音效</span><div class="seg" id="sSnd"><button class="${S.snd?"on":""}" data-v="1">開</button><button class="${S.snd?"":"on"}" data-v="0">關</button></div></div>
   <div class="row" style="border:0;padding-bottom:0"><span>日文發音${ttsOk&&!jaVoice?"（找不到日文語音）":""}</span><div class="seg" id="sTts"><button class="${S.tts?"on":""}" data-v="1">開</button><button class="${S.tts?"":"on"}" data-v="0">關</button></div></div>
  </div>
  <h2 class="sec">🔄 換裝置</h2><div class="card" style="margin-top:0"><div class="quick" style="margin-top:0"><button class="btn" id="bExp">📤 複製進度碼</button><button class="btn" id="bImp">📥 貼上進度碼</button></div><div class="hint">進度存在這個瀏覽器。換手機／電腦時，在舊裝置按「複製」，到新裝置按「貼上」。</div></div>`;
  $("#vMe").innerHTML=h;
  $("#bFreeze").onclick=()=>{S.gems-=50;S.freeze++;save();SFX.chest();toast("🧊 買了連勝凍結");renderAll();};
  $("#bHeart").onclick=()=>{S.gems-=30;S.hearts=5;S.hAt=Date.now();save();SFX.chest();toast("❤️ 愛心補滿");renderAll();};
  $("#sGoal").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.goal=+b.dataset.g;save();renderAll();});
  $("#sSnd").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.snd=b.dataset.v==="1";save();renderAll();SFX.ok(0);});
  $("#sTts").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.tts=b.dataset.v==="1";save();renderAll();speak("がんばって");});
  $("#bExp").onclick=async()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));try{await navigator.clipboard.writeText(code);toast("📋 已複製進度碼");}catch(e){prompt("複製這段進度碼：",code);}};
  $("#bImp").onclick=()=>{const c=prompt("貼上進度碼：");if(!c)return;try{const v=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(typeof v.xp!=="number")throw 0;S=Object.assign(def(),v);save();toast("✅ 進度已匯入");renderAll();}catch(e){toast("❌ 進度碼不正確");}};
}
let view="Home";
function renderAll(){tickHearts();tickDay();renderTop();if(view==="Home")renderHome();else if(view==="Words")renderWords();else renderMe();save();}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x===b));["Home","Words","Me"].forEach(v=>$("#v"+v).hidden=v!==view);SFX.tap();renderAll();scrollTo(0,0);});
$("#pHeart").onclick=()=>{tickHearts();if(S.hearts<5){const mins=Math.ceil((HEART_MS-(Date.now()-S.hAt))/60000);toast("❤️ 下一顆約 "+mins+" 分鐘後回復");}else toast("❤️ 愛心是滿的！");};
$("#pFire").onclick=()=>toast(S.last===dk()?"🔥 今天已經練過了，連勝 "+S.streak+" 天":"今天還沒練！完成一關點燃連勝 🔥");
$("#pGem").onclick=()=>toast("💎 過關開寶箱、達成每日目標、解鎖成就都能拿");
document.addEventListener("keydown",e=>{
  if(!L||!$("#lesson").classList.contains("show")||$("#md").classList.contains("show"))return;
  if(/^[1-4]$/.test(e.key)&&!L.locked){const b=document.querySelectorAll(".opt")[+e.key-1];if(b)b.click();}
  else if(e.key==="Enter"){const c=$("#cont");if(c)c.click();}
});
document.addEventListener("pointerdown",()=>ac(),{once:true});
setInterval(()=>{if(!L)renderTop();},30000);
renderAll();
</script>
</body>
</html>
